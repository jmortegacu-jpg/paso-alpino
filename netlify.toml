# Configuración del sitio de Paso Alpino en Netlify.
# No hace falta compilar nada: el juego es un solo archivo y el contador es una función.
[build]
  publish = "."
  functions = "netlify/functions"
  # Pone la dirección real del sitio en el juego (vista previa de WhatsApp y enlaces de reto).
  command = "sed -i \"s#__SITE_URL__#${URL}#g\" index.html && echo 'Paso Alpino listo'"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/panel"
  to = "/panel.html"
  status = 200

# Que los navegadores siempre busquen la última versión del juego.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
